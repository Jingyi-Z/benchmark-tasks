<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="270.0mm" height="305.0mm" viewBox="0 0 270.0 305.0">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .cut { fill: none; stroke: #cc0000; stroke-width: 0.45; }
    .stock { fill: none; stroke: #888888; stroke-width: 0.35; stroke-dasharray: 3,2; }
    .guide { fill: none; stroke: #0055aa; stroke-width: 0.35; stroke-dasharray: 2,1.5; }
    .dim { stroke: #222222; stroke-width: 0.30; fill: none; }
  </style>
  <rect x="0" y="0" width="270.0" height="305.0" fill="#ffffff"/>
  <text x="135" y="9" font-size="4.4" font-weight="bold" text-anchor="middle">1:1 FABRICATION TEMPLATE: 247.6 x 4.8 mm TWO-PLY FOIL CORRUGATED CAKE CIRCLE (~55 g)</text>

  <!-- 10 in nominal stock outline (254.0 mm) -->
  <circle cx="135.0" cy="140.0" r="127.00" class="stock"/>
  <!-- Finished outer cut line: 247.6 mm OD (leaves 3.2 mm nominal clearance per side in 254.0 mm carton) -->
  <circle cx="135.0" cy="140.0" r="123.80" class="cut"/>
  <!-- Bottom ski-bevel inner guide: 241.6 mm OD (sand/chamfer bottom kraft edge 3.0 mm radial x 1.2 mm vertical) -->
  <circle cx="135.0" cy="140.0" r="120.80" class="guide"/>
  <!-- Bottom royal-icing border outer limit: 217.0 mm OD (108.5 mm radius -> 15.3 mm exposed silver pushing rim) -->
  <circle cx="135.0" cy="140.0" r="108.50" class="guide"/>
  <!-- Fondant dummy body centering circle: 208.0 mm OD (104.0 mm radius) -->
  <circle cx="135.0" cy="140.0" r="104.00" class="guide"/>
  <line x1="129.0" y1="140.0" x2="141.0" y2="140.0" class="dim"/>
  <line x1="135.0" y1="134.0" x2="135.0" y2="146.0" class="dim"/>

  <text x="135.0" y="20.7" font-size="3.1" fill="#cc0000" text-anchor="middle">SOLID RED = CUT TO 247.6 +/- 0.5 mm OD (R = 123.8 mm)</text>
  <text x="135.0" y="36.0" font-size="3.0" fill="#0055aa" text-anchor="middle">MAX PIPED BORDER = 217.0 mm OD (LEAVES 15.3 mm SILVER PUSHING RIM)</text>
  <text x="135.0" y="41.0" font-size="3.0" fill="#0055aa" text-anchor="middle">FONDANT CAKE BODY = 208.0 mm OD (CENTERED)</text>
  <text x="135.0" y="146.0" font-size="3.0" text-anchor="middle">Stock: 2x Wilton 10 in Corrugated White Cake Circles (MFR 191001569)</text>

  <!-- 100.0 mm print verification scale bar -->
  <line x1="85" y1="274" x2="185" y2="274" stroke="#000000" stroke-width="0.6"/>
  <line x1="85" y1="271.5" x2="85" y2="276.5" stroke="#000000" stroke-width="0.6"/>
  <line x1="185" y1="271.5" x2="185" y2="276.5" stroke="#000000" stroke-width="0.6"/>
  <text x="135" y="272.5" font-size="3.2" font-weight="bold" text-anchor="middle">PRINT SCALE CHECK: 100.0 mm EXACT (PRINT AT 100% / ACTUAL SIZE)</text>

  <text x="10" y="282.5" font-size="2.9">1. Laminate two 10 in Wilton MFR 191001569 single-wall B-flute circles (~2.4 mm/ply) at 90 deg crossed flutes with thin PVA glue; press flat (4.8 +/- 0.4 mm).</text>
  <text x="10" y="287.0" font-size="2.9">2. Wrap top face smoothly with 0.018 mm household silver aluminum foil (tucking only onto top/side or flush before final trim; keep kraft underside exposed).</text>
  <text x="10" y="291.5" font-size="2.9">3. Trim around SOLID RED circle to 247.6 +/- 0.5 mm OD; lightly chamfer/sand bottom kraft perimeter 3.0 mm inward x 1.2 mm high so board glides onto 1.0 mm box base.</text>
  <text x="10" y="296.0" font-size="2.9">4. Pre-trial check: caliper thickness 4.8 +/- 0.4 mm, steel-ruler OD 247.6 +/- 0.5 mm (3.2 mm nominal clearance/side in 254.0 mm box), 1 g scale mass 55 +/- 6 g.</text>
</svg>
